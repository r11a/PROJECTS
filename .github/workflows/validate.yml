name: Validate PROJECTS

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  addon-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 Home Assistant App image
        uses: docker/build-push-action@v6
        with:
          context: projects
          platforms: linux/amd64
          load: true
          push: false
          tags: local/projects:ci
      - name: Smoke test PostgreSQL, API and Nginx
        run: |
          trap 'docker logs projects-smoke' ERR
          docker run --detach --name projects-smoke --publish 8686:8686 local/projects:ci
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8686/health | grep --quiet '"database":"ok"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8686/health | grep --quiet '"database":"ok"'
          curl --fail --silent --cookie-jar /tmp/projects-cookies \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"change-me-now"}' \
            http://127.0.0.1:8686/api/auth/login | grep --quiet '"role":"admin"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/projects | grep --quiet '"projects"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/clients | grep --quiet '"clients"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/settings | grep --quiet '"catalogs"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            --header 'Content-Type: application/json' \
            --request PATCH \
            --data '{"name":"PROJECTS CI COMPANY","companyNumber":"515151515","phone":"03-5555555","email":"ci@example.test","address":"Tel Aviv"}' \
            http://127.0.0.1:8686/api/settings/company | grep --quiet 'PROJECTS CI COMPANY'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/settings | grep --quiet 'PROJECTS CI COMPANY'
          curl --fail --silent --cookie /tmp/projects-cookies \
            'http://127.0.0.1:8686/api/calendar?from=2026-01-01T00%3A00%3A00.000Z&to=2027-01-01T00%3A00%3A00.000Z' | grep --quiet '"events"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/insights | grep --quiet '"stats"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/forms | grep --quiet '"templates"'
          curl --fail --silent --cookie /tmp/projects-cookies \
            --header 'Content-Type: application/json' \
            --data '{"templateId":1,"title":"CI FORM DRAFT","status":"draft","values":{}}' \
            http://127.0.0.1:8686/api/form-records | grep --quiet 'CI FORM DRAFT'
          curl --fail --silent --cookie /tmp/projects-cookies \
            http://127.0.0.1:8686/api/forms | grep --quiet 'CI FORM DRAFT'
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force projects-smoke || true
