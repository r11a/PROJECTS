map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $projects_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 8099 default_server;
    server_name _;
    client_max_body_size 2048m;

    allow 172.30.32.2;
    deny all;

    root /var/www/projects;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $projects_forwarded_proto;
        proxy_set_header X-Projects-Ingress "true";
        proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
        proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
        proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/health;
    }
}

server {
    listen 8686;
    server_name _;
    client_max_body_size 2048m;

    root /var/www/projects;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $projects_forwarded_proto;
        proxy_set_header X-Projects-Ingress "false";
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/health;
    }
}
